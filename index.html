<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ClaimTak — Claim Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/5.0.5/tesseract.min.js"></script>
<style>
  :root{
    --primary:#1e4d7b; --primary-dark:#123152; --primary-light:#2e6f9e; --accent:#3f8fc4;
    --bg:#f4f7fa; --surface:#ffffff; --border:#dbe4ec; --text:#1a2530; --text-muted:#5c6b7a;
    --success:#256c4b; --success-bg:#e5f3ec; --warning:#a06a1f; --warning-bg:#fbf0dc;
    --danger:#a4392f; --danger-bg:#fbe9e7; --radius:12px; --radius-sm:8px;
    --shadow:0 1px 3px rgba(20,40,60,0.08), 0 1px 2px rgba(20,40,60,0.06);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{font-family:'Inter','Noto Sans Devanagari',system-ui,sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;min-height:100vh;}
  #app{min-height:100vh;display:flex;flex-direction:column;}
  header.topbar{background:linear-gradient(135deg,var(--primary-dark),var(--primary));color:#fff;padding:14px 18px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 2px 8px rgba(10,30,50,0.18);position:sticky;top:0;z-index:50;}
  .brand{display:flex;align-items:center;gap:10px;}
  .brand-mark{width:36px;height:36px;border-radius:9px;background:rgba(255,255,255,0.14);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;border:1px solid rgba(255,255,255,0.25);}
  .brand-text h1{font-size:16px;margin:0;font-weight:700;}
  .brand-text span{font-size:11px;opacity:0.75;display:block;margin-top:1px;}
  .header-right{display:flex;align-items:center;gap:10px;}
  .user-chip{font-size:13px;background:rgba(255,255,255,0.12);padding:6px 12px;border-radius:20px;display:flex;align-items:center;gap:6px;}
  .logout-btn{background:transparent;border:1px solid rgba(255,255,255,0.35);color:#fff;padding:6px 12px;border-radius:20px;font-size:12px;cursor:pointer;font-family:inherit;}
  .logout-btn:hover{background:rgba(255,255,255,0.12);}
  main{flex:1;padding:16px;max-width:920px;width:100%;margin:0 auto;}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:12px;box-shadow:var(--shadow);}
  .section-title{font-size:15px;font-weight:700;margin:4px 0 12px;color:var(--primary-dark);}
  .row-between{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;}
  .btn{background:var(--primary);color:#fff;border:none;padding:10px 16px;border-radius:var(--radius-sm);font-size:13.5px;font-weight:600;cursor:pointer;font-family:inherit;transition:background .15s;}
  .btn:hover{background:var(--primary-dark);}
  .btn.secondary{background:var(--surface);color:var(--primary);border:1px solid var(--border);}
  .btn.secondary:hover{background:var(--bg);}
  .btn.success{background:#2f8f63;} .btn.success:hover{background:var(--success);}
  .btn.danger{background:var(--danger);}
  .btn.small{padding:6px 11px;font-size:12px;}
  .btn:disabled{opacity:0.5;cursor:not-allowed;}
  .field{margin-bottom:12px;}
  .field label{display:block;font-size:12.5px;font-weight:600;color:var(--text-muted);margin-bottom:5px;}
  .field input, .field select, .field textarea{width:100%;padding:9px 11px;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:13.5px;font-family:inherit;background:#fff;color:var(--text);}
  .field input:focus, .field select:focus, .field textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(63,143,196,0.15);}
  .field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  @media (max-width:520px){.field-row{grid-template-columns:1fr;}}
  .badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11.5px;font-weight:700;}
  .badge.success{background:var(--success-bg);color:var(--success);}
  .badge.warning{background:var(--warning-bg);color:var(--warning);}
  .badge.danger{background:var(--danger-bg);color:var(--danger);}
  .badge.neutral{background:#eef2f6;color:var(--text-muted);}
  .empty-state{text-align:center;padding:40px 20px;color:var(--text-muted);}
  .empty-state .icon{font-size:34px;margin-bottom:8px;}
  .list-item{border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px 14px;margin-bottom:8px;background:#fff;}
  .list-item:hover{border-color:var(--accent);}
  .item-title{font-weight:700;font-size:14px;}
  .item-sub{font-size:12.5px;color:var(--text-muted);margin-top:2px;}
  .modal-overlay{position:fixed;inset:0;background:rgba(15,30,45,0.45);display:flex;align-items:flex-start;justify-content:center;padding:24px 12px;z-index:100;overflow-y:auto;}
  .modal{background:#fff;border-radius:var(--radius);max-width:560px;width:100%;padding:20px;box-shadow:0 12px 40px rgba(0,0,0,0.25);margin-top:12px;}
  .modal h3{margin:0 0 14px;font-size:16px;color:var(--primary-dark);}
  .modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;flex-wrap:wrap;}
  .login-wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:20px;}
  .login-box{background:#fff;border-radius:var(--radius);box-shadow:0 10px 40px rgba(20,40,60,0.12);padding:32px 28px;max-width:380px;width:100%;border:1px solid var(--border);}
  .login-logo{text-align:center;margin-bottom:18px;}
  .login-logo .brand-mark{margin:0 auto 10px;background:var(--primary);color:#fff;width:52px;height:52px;font-size:18px;}
  .login-logo h1{font-size:19px;margin:0;color:var(--primary-dark);}
  .login-logo p{font-size:12.5px;color:var(--text-muted);margin:4px 0 0;}
  .link-btn{background:none;border:none;color:var(--primary);font-size:13px;cursor:pointer;font-family:inherit;font-weight:600;padding:0;}
  .error-text{color:var(--danger);font-size:12.5px;margin:-4px 0 10px;}
  .hint-text{color:var(--text-muted);font-size:11.5px;margin-top:6px;}
  .timeline{border-left:2px solid var(--border);padding-left:14px;margin:10px 0 10px 6px;}
  .timeline-entry{margin-bottom:14px;position:relative;}
  .timeline-entry::before{content:'';position:absolute;left:-19px;top:4px;width:9px;height:9px;border-radius:50%;background:var(--primary);}
  .timeline-entry .t-stage{font-weight:700;font-size:13px;}
  .timeline-entry .t-date{font-size:11.5px;color:var(--text-muted);}
  .timeline-entry .t-note{font-size:12.5px;color:var(--text);margin-top:2px;}
  .timeline-entry .t-log{font-size:10.5px;color:#8a97a5;margin-top:3px;font-style:italic;}
  .timeline-entry .t-meta{font-size:12px;color:var(--text-muted);margin-top:2px;}
  .doc-row{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--bg);}
  .doc-row:last-child{border-bottom:none;}
  .doc-row .doc-name{flex:1;font-size:13px;}
  .stage-select{font-size:12px;}
  .wa-btn{background:#25963f;color:#fff;border:none;padding:7px 12px;border-radius:20px;font-size:12px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:5px;text-decoration:none;}
  .wa-btn:hover{background:#1e7a33;}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--primary-dark);color:#fff;padding:10px 18px;border-radius:24px;font-size:13px;z-index:200;box-shadow:0 6px 20px rgba(0,0,0,0.25);}
  .footer-note{text-align:center;font-size:11px;color:var(--text-muted);padding:14px;}
  .paste-box{width:100%;min-height:110px;border:2px dashed var(--accent);border-radius:var(--radius-sm);padding:10px;font-family:monospace;font-size:12px;background:#f7fbff;}
  .parsed-preview{background:var(--success-bg);border:1px solid var(--success);border-radius:var(--radius-sm);padding:10px;margin-top:8px;font-size:12.5px;}
  .parsed-preview b{color:var(--success);}
  .report-table{width:100%;border-collapse:collapse;font-size:12.5px;}
  .report-table th, .report-table td{border:1px solid var(--border);padding:6px 8px;text-align:left;vertical-align:top;}
  .report-table th{background:var(--bg);}
</style>
</head>
<body>
<div id="app"></div>
<script>
if(window.pdfjsLib){ pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'; }
/* ===================== CONSTANTS ===================== */
const CLAIM_STAGES = ['Intimation','Preauth Sent','Preauth Query','Preauth Approved','Preauth Rejected',
  'Discharge','Form B Sent','Reimbursement Filed','Query Raised','Reply Sent','Settled','Rejected',
  'Reconsideration','Grievance','Bima Bharosa Cell','Ombudsman Online','Ombudsman Physical','Hearing','Final Result'];
const CLAIM_TYPES = ['Cashless','Reimbursement'];
const POLICY_KEYS = ['TYPE','INSURER','POLICY NO','POLICY HOLDER NAME','PATIENT NAME','SUM INSURED','POLICY FROM','POLICY TO'];
const UPDATE_KEYS = ['TYPE','STAGE','CLAIM NO','HOSPITAL','DATE','AMOUNT','NEXT ACTION','REASON'];
const ALL_KEYS = Array.from(new Set([...POLICY_KEYS, ...UPDATE_KEYS]));

/* ===================== STATE ===================== */
let CLAIMS = [];
let modalHtml = null;
let SEARCH_QUERY = '';
let CUR_MEMBERS = [], CUR_FILE = null, PENDING_R = null, CUR_FULL = '';
let VIEW_LIST = 'live', SELECT_MODE = false, SELECTED = new Set();
const DEF_PHRASES = ['मेल पाठवला','मेल आला','फोन केला','कागदपत्रे पाठवली','SMS आला','WhatsApp केले'];
function getPhrases(){ try{ const v = JSON.parse(localStorage.getItem('ct_phrases')||'null'); if(Array.isArray(v)&&v.length) return v; }catch(e){} return DEF_PHRASES.slice(); }
function nowLocal(){ const d=new Date(); d.setMinutes(d.getMinutes()-d.getTimezoneOffset()); return d.toISOString().slice(0,16); }
function listOf(c){ return c.status==='approved' ? 'approved' : c.status==='rejected' ? 'rejected' : 'live'; }

/* ===================== STORAGE (localStorage + manual backup) ===================== */
function loadClaimsLocal(){
  try{ const raw = localStorage.getItem('ct_claims_local'); return raw ? JSON.parse(raw) : []; }
  catch(e){ return []; }
}
function saveClaimsLocal(){
  try{ localStorage.setItem('ct_claims_local', JSON.stringify(CLAIMS)); }
  catch(e){ showToast('या डिव्हाइसवर सेव्ह करताना त्रुटी आली'); }
}
function loadAll(){
  CLAIMS = loadClaimsLocal();
  render();
  autoBackupOnFirstTap();
}
function getLastName(){
  try{ return localStorage.getItem('ct_last_name') || ''; } catch(e){ return ''; }
}
function setLastName(name){
  try{ localStorage.setItem('ct_last_name', name); } catch(e){}
}

/* ===================== BACKUP: EXPORT / IMPORT ===================== */
function exportBackup(){
  const blob = new Blob([JSON.stringify(CLAIMS, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const stamp = new Date().toISOString().slice(0,10);
  a.href = url; a.download = `claimtak-backup-${stamp}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
  try{ localStorage.setItem('ct_last_backup', todayISO()); }catch(e){}
  showToast('बॅकअप डाऊनलोड झाला — आता Google Drive मध्ये सेव्ह करा');
}
async function shareBackup(){
  const name = `claimtak-backup-${todayISO()}.json`;
  const file = new File([JSON.stringify(CLAIMS, null, 2)], name, {type:'application/json'});
  if(navigator.canShare && navigator.canShare({files:[file]})){
    try{ await navigator.share({files:[file], title:'ClaimTak बॅकअप'}); try{ localStorage.setItem('ct_last_backup', todayISO()); }catch(e){} showToast('✓ बॅकअप पाठवला'); }
    catch(e){}
  } else exportBackup();
}
function autoBackupOnFirstTap(){
  let last=''; try{ last = localStorage.getItem('ct_last_backup')||''; }catch(e){}
  if(!CLAIMS.length || last === todayISO()) return;
  const go = () => { document.removeEventListener('click', go, true); exportBackup(); showToast('आजचा बॅकअप आपोआप घेतला (Downloads मध्ये)'); };
  document.addEventListener('click', go, true);
}
function triggerImport(){
  document.getElementById('importFileInput').click();
}
function handleImportFile(input){
  const file = input.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    try{
      const incoming = JSON.parse(e.target.result);
      if(!Array.isArray(incoming)) throw new Error('invalid');
      const map = {};
      CLAIMS.forEach(c => map[c.id] = c);
      incoming.forEach(c => map[c.id] = c);
      CLAIMS = Object.values(map);
      saveClaimsLocal();
      render();
      showToast(`✓ ${incoming.length} क्लेम्स अपडेट/जोडले गेले`);
    }catch(err){
      showToast('⚠ फाईल वाचता आली नाही — योग्य .json बॅकअप फाईल निवडा');
    }
  };
  reader.readAsText(file);
  input.value = '';
}

/* ===================== UTIL ===================== */
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function esc(s){ return (s===undefined||s===null) ? '' : String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function todayISO(){ const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
const MR_DAYS=['रविवार','सोमवार','मंगळवार','बुधवार','गुरुवार','शुक्रवार','शनिवार'];
function toDate(iso){ if(/^\d{4}-\d{2}-\d{2}$/.test(iso||'')){const [y,m,d]=iso.split('-');return new Date(+y,m-1,+d);} return new Date(iso); }
function formatDate(iso){
  if(!iso) return '—';
  const d = toDate(iso); if(isNaN(d)) return iso;
  return MR_DAYS[d.getDay()]+', '+d.toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'});
}
function formatDateTime(iso){
  if(!iso) return '—';
  const d = toDate(iso); if(isNaN(d)) return iso;
  return formatDate(iso)+', '+d.toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'});
}
function parseFlexibleDate(str){
  if(!str) return '';
  str = str.trim();
  const mn = str.match(/^(\d{1,2})[\/. -]([A-Za-z]{3})[a-z]*[\/. -](\d{2,4})$/);
  if(mn){ const i=['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'].indexOf(mn[2].toLowerCase());
    if(i>-1){ let y=+mn[3]; if(y<100) y+=2000; return `${y}-${String(i+1).padStart(2,'0')}-${String(mn[1]).padStart(2,'0')}`; } }
  let m = str.match(/^(\d{1,2})[\/. -](\d{1,2})[\/. -](\d{2,4})$/);
  if(m){ let y=+m[3]; if(y<100) y+=2000; return `${y}-${String(m[2]).padStart(2,'0')}-${String(m[1]).padStart(2,'0')}`; }
  const d = new Date(str);
  if(!isNaN(d)) return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  return '';
}
function waLink(mobile, message){
  let digits = (mobile||'').replace(/\D/g,'');
  if(digits.length === 10) digits = '91' + digits;
  return `https://wa.me/${digits}?text=${encodeURIComponent(message)}`;
}
function showToast(msg){
  const t = document.createElement('div');
  t.className = 'toast'; t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(), 2400);
}
function handleSearchInput(val){
  SEARCH_QUERY = val;
  render();
  const inp = document.getElementById('claimSearchInput');
  if(inp){ inp.focus(); const len = inp.value.length; inp.setSelectionRange(len, len); }
}
function stageBadgeClass(stage){
  if(['Settled','Preauth Approved','Final Result'].includes(stage)) return 'success';
  if(['Rejected','Preauth Rejected'].includes(stage)) return 'danger';
  return 'warning';
}
function statusMeta(status){
  if(status === 'rejected') return {label:'Rejected', cls:'danger'};
  if(status === 'query') return {label:'Query', cls:'warning'};
  if(status === 'approved') return {label:'Approved', cls:'success'};
  return {label:'Live', cls:'success'};
}
async function setClaimStatus(id, status){
  const cl = CLAIMS.find(x=>x.id===id);
  if(!cl) return;
  cl.status = status;
  saveClaimsLocal();
  showToast('स्टेटस अपडेट झाला');
  openClaimDetail(id);
}

/* ===================== PDF.js EXTRACTION (free, client-side) ===================== */
function extractPdfText(file){
  return new Promise((resolve, reject) => {
    if(!window.pdfjsLib){ reject(new Error('pdfjs not loaded')); return; }
    const reader = new FileReader();
    reader.onload = async function(e){
      try{
        const typedarray = new Uint8Array(e.target.result);
        const pdf = await pdfjsLib.getDocument({data: typedarray}).promise;
        let fullText = '';
        for(let i=1; i<=pdf.numPages; i++){
          const page = await pdf.getPage(i);
          const content = await page.getTextContent();
          fullText += content.items.map(it => it.str).join(' ') + '\n';
        }
        resolve(fullText);
      }catch(err){ reject(err); }
    };
    reader.onerror = () => reject(new Error('file read error'));
    reader.readAsArrayBuffer(file);
  });
}
function extractPolicyFieldsFromText(text){
  const r = {}; let m;
  if(/star\s*health/i.test(text)) r['INSURER'] = 'Star Health';
  else if(/\bLIC\b|Life Insurance Corporation/i.test(text)) r['INSURER'] = 'LIC';
  else if(/Bajaj/i.test(text)) r['INSURER'] = 'Bajaj General';
  m = text.match(/Policy\s*No\.?\s*:?\s*([A-Z0-9]{6,})/i);
  if(m) r['POLICY NO'] = m[1];
  m = text.match(/Proposer\s*Name\s*:?\s*([A-Z]{2,}(?:\s+[A-Z]{2,}){0,4})/);
  if(m) r['POLICY HOLDER NAME'] = m[1].trim();
  m = text.match(/Sum\s*Insured[^:]{0,25}:\s*Rs\.?\s*([\d,]+)/i);
  if(m) r['SUM INSURED'] = m[1];
  m = text.match(/From\s*:?\s*(\d{1,2}-[A-Za-z]{3}-\d{4})/i);
  if(m) r['POLICY FROM'] = m[1];
  m = text.match(/To\s*:?\s*(?:Midnight Of\s*)?(\d{1,2}-[A-Za-z]{3}-\d{4})/i);
  if(m) r['POLICY TO'] = m[1];
  return r;
}
function extractUpdateFieldsFromText(text){
  const r = {}; let m;
  if(/unable to admit the claim|cashless claim stands rejected/i.test(text)) r['STAGE'] = 'Preauth Rejected';
  else if(/claim[^.]{0,25}(has been |stands )?approved/i.test(text)) r['STAGE'] = 'Preauth Approved';
  else if(/query/i.test(text) && /preauth|cashless/i.test(text)) r['STAGE'] = 'Preauth Query';
  else if(/claim[^.]{0,20}settled/i.test(text)) r['STAGE'] = 'Settled';
  else if(/claim[^.]{0,20}rejected/i.test(text)) r['STAGE'] = 'Rejected';
  m = text.match(/Claim\s*Intimation\s*Number\s*:?\s*([A-Z0-9\/\-]+)/i) || text.match(/Claim\s*No\.?\s*:?\s*([A-Z0-9\/\-]+)/i);
  if(m) r['CLAIM NO'] = m[1];
  m = text.match(/Name of the Hospital and Location\s*:?\s*(.{3,120}?)(?=\s+(?:After carefully|We regret|Dear|Room Category|Kindly)|$)/i);
  if(m) r['HOSPITAL'] = m[1].trim();
  m = text.match(/Date\s*:\s*(\d{1,2}-[A-Za-z]{3}-\d{4})/i);
  if(m) r['DATE'] = m[1];
  m = text.match(/reason\(s\):\s*1\.\s*(.{10,300}?)\s*(?:The denial clause|$)/i) || text.match(/We regret[^.]*\.\s*(.{10,300}?)\s*(?:The denial clause|$)/i);
  if(m) r['REASON'] = m[1].trim();
  return r;
}

/* ===================== UNIVERSAL: PDF / SCREENSHOT -> TEXT -> FIELDS ===================== */
async function ocrImage(src){ if(!window.Tesseract) throw new Error('ocr not loaded'); const r = await Tesseract.recognize(src,'eng'); return r.data.text; }
async function ocrPdf(file){
  const pdf = await pdfjsLib.getDocument({data: new Uint8Array(await file.arrayBuffer())}).promise;
  let t='';
  for(let i=1;i<=Math.min(pdf.numPages,3);i++){
    const page = await pdf.getPage(i), vp = page.getViewport({scale:2});
    const c = document.createElement('canvas'); c.width=vp.width; c.height=vp.height;
    await page.render({canvasContext:c.getContext('2d'),viewport:vp}).promise;
    t += await ocrImage(c.toDataURL('image/png')) + '\n';
  }
  return t;
}
async function extractTextFromFile(file){
  if(file.type.startsWith('image/')) return await ocrImage(file);
  let t = await extractPdfText(file);
  if(t.replace(/\s/g,'').length < 40) t = await ocrPdf(file);
  return t;
}
function cleanName(v){
  if(!v) return '';
  v = v.split(/\b(Policy|Policyholder|Proposer|Insured|Patient|Claim|Mobile|Age|Address|Date|Sum|Hospital|Relationship|Contact|Phone|DOB|Gender|Name|Diagnosis|Doctor|Ailment|Treatment|Admission|Discharge)\b/i)[0];

/* ===================== PASTE PARSER ===================== */
function parsePastedText(text){
  const lines = (text||'').split(/\r?\n/);
  const result = {};
  let currentKey = null;
  for(let raw of lines){
    const line = raw.trim();
    if(!line) continue;
    const idx = line.indexOf(':');
    let matched = null;
    if(idx > -1){
      const label = line.slice(0, idx).trim().toUpperCase();
      matched = ALL_KEYS.find(k => k === label);
    }
    if(matched){
      currentKey = matched;
      result[currentKey] = line.slice(idx+1).trim();
    } else if(currentKey){
      result[currentKey] = (result[currentKey] ? result[currentKey] + ' ' : '') + line;
    }
  }
  return result;
}

function fillPolicyForm(r){
  const f = document.getElementById('claimForm');
  const map = {
    'POLICY HOLDER NAME':'policyHolderName', 'PATIENT NAME':'patientName',
    'INSURER':'insurer', 'POLICY NO':'policyNo', 'SUM INSURED':'sumInsured', 'CLAIM NO':'claimNo',
    'MOBILE':'mobile', 'OLD POLICY NO':'oldPolicyNo', 'BASIC SI':'basicSI', 'BONUS':'bonus', 'DEDUCTIBLE':'deductible',
    'EMAIL':'email', 'ADDRESS':'address', 'CARE NO':'careNo', 'PRODUCT NAME':'productName', 'UIN':'uin'
  };
  let filled = [];
  for(const k in map){ if(r[k]){ f[map[k]].value = r[k]; filled.push(k); } }
  if(r['CLAIM START']){ f.claimStart.value = parseFlexibleDate(r['CLAIM START']) || f.claimStart.value; filled.push('CLAIM START'); }
  if(r['POLICY FROM']){ f.policyFrom.value = parseFlexibleDate(r['POLICY FROM']); filled.push('POLICY FROM'); }
  if(r['POLICY TO']){ f.policyTo.value = parseFlexibleDate(r['POLICY TO']); filled.push('POLICY TO'); }
  if(r['FIRST INCEPTION']){ f.firstInception.value = parseFlexibleDate(r['FIRST INCEPTION']); filled.push('FIRST INCEPTION'); }
  if(r['MEMBERS'] && r['MEMBERS'].length){ CUR_MEMBERS = r['MEMBERS']; document.getElementById('memberBox').innerHTML = membersBoxHtml(); filled.push('MEMBERS ('+CUR_MEMBERS.length+')'); }
  return filled;
}
function showPolicyParsePreview(filled, note){
  const prev = document.getElementById('policyParsePreview');
  if(filled.length){
    const miss = ['POLICY NO','INSURER','BASIC SI','BONUS','DEDUCTIBLE','MOBILE','EMAIL','ADDRESS','FIRST INCEPTION','CARE NO'].filter(k=>!filled.includes(k));
    if(!filled.some(k=>k.startsWith('MEMBERS'))) miss.push('MEMBERS');
    prev.innerHTML = `<div class="parsed-preview"><b>✓ भरले गेले:</b> ${filled.join(', ')}. खाली तपासून Save करा.${miss.length?`<br><b>no information:</b> ${miss.join(', ')}`:''}</div>`;
  } else {
    prev.innerHTML = `<div class="parsed-preview" style="background:var(--danger-bg);border-color:var(--danger);"><b>⚠ काहीच ओळखलं नाही.</b> ${note || 'फॉरमॅट तपासा (उदा. "POLICY NO: ...").'}</div>`;
  }
}

async function handlePolicyPdfUpload(input){
  const file = input.files[0];
  if(!file) return;
  const prev = document.getElementById('policyParsePreview');
  prev.innerHTML = `<div class="parsed-preview">⏳ PDF वाचत आहे...</div>`;
  try{
    const text = await extractTextFromFile(file);
    const r = extractAllFields(text);
    CUR_FILE = {name:file.name, at:new Date().toISOString()};
    showPolicyParsePreview(fillPolicyForm(r), 'मॅन्युअली फील्ड्स भरा किंवा पेस्ट-बॉक्स पद्धत वापरा.');
  }catch(err){
    prev.innerHTML = `<div class="parsed-preview" style="background:var(--danger-bg);border-color:var(--danger);">⚠ PDF वाचता आलं नाही. पेस्ट-बॉक्स पद्धत वापरा.</div>`;
  }
  input.value = '';
}

    filled.push('STAGE');
  }
  if(r['DATE']){ f.date.value = parseFlexibleDate(r['DATE']) || todayISO(); filled.push('DATE'); }
  if(r['AMOUNT']){ f.amount.value = r['AMOUNT']; filled.push('AMOUNT'); }
  if(r['HOSPITAL']){ f.hospital.value = r['HOSPITAL']; filled.push('HOSPITAL'); }
  if(r['NEXT ACTION']){ f.nextAction.value = r['NEXT ACTION']; filled.push('NEXT ACTION'); }
  if(r['REASON']){ f.note.value = r['REASON'] + (r['DENIAL CLAUSE'] ? ' (Denial clause: '+r['DENIAL CLAUSE']+')' : ''); filled.push('REASON'); }
  if(r['ADMISSION']){ f.admission.value = parseFlexibleDate(r['ADMISSION']); filled.push('ADMISSION'); }
  if(r['DISCHARGE']){ f.discharge.value = parseFlexibleDate(r['DISCHARGE']); filled.push('DISCHARGE'); }
  if(r['DIAGNOSIS']){ f.diagnosis.value = r['DIAGNOSIS']; filled.push('DIAGNOSIS'); }
  if(r['DOCTOR']){ f.doctor.value = r['DOCTOR']; filled.push('DOCTOR'); }
  if(r['QUERY DETAILS']){ f.queryDetails.value = r['QUERY DETAILS']; filled.push('QUERY DETAILS'); }
  if(r['DATE'] && r['EVENT TIME']){ f.eventAt.value = (parseFlexibleDate(r['DATE'])||todayISO())+'T'+to24(r['EVENT TIME']); filled.push('DATE/TIME'); }
  if(r['REPLY BY']){ f.nextDate.value = parseFlexibleDate(r['REPLY BY']); if(!f.nextAction.value) f.nextAction.value = 'Query चे उत्तर द्या'; filled.push('REPLY BY'); }
  if(r['STATUS']){ f.status.value = r['STATUS']; filled.push('STATUS'); }
  if(r['FULL TEXT']) CUR_FULL = r['FULL TEXT'];
  if(r['SENT AT']){ f.eventAt.value = r['SENT AT']; filled.push('पाठवल्याची तारीख-वेळ'); }
  if(r['CLAIM NO']) f.claimNo.value = r['CLAIM NO'];
  if(r['CLAIM NO']){
    const cl = CLAIMS.find(x=>x.id===id);
    if(cl && !cl.claimNo){ cl.claimNo = r['CLAIM NO']; saveClaimsLocal(); }
    filled.push('CLAIM NO (क्लेमला जोडले)');
  }
  return filled;
}
function showUpdateParsePreview(filled, note){
  const prev = document.getElementById('updateParsePreview');
  if(filled.length){
    prev.innerHTML = `<div class="parsed-preview"><b>✓ भरले गेले:</b> ${filled.join(', ')}. खाली तपासून Save करा.</div>`;
  } else {
    prev.innerHTML = `<div class="parsed-preview" style="background:var(--danger-bg);border-color:var(--danger);"><b>⚠ काहीच ओळखलं नाही.</b> ${note || 'फॉरमॅट तपासा (उदा. "STAGE: ...").'}</div>`;
  }
}
function parseUpdatePaste(id){
  const text = document.getElementById('updatePasteBox').value;
  const r = parsePastedText(text);
  showUpdateParsePreview(fillUpdateForm(id, r));
}
async function handleUpdatePdfUpload(id, input){
  const file = input.files[0];
  if(!file) return;
  const prev = document.getElementById('updateParsePreview');
  prev.innerHTML = `<div class="parsed-preview">⏳ PDF वाचत आहे...</div>`;
  try{
    const text = await extractTextFromFile(file);
    const r = extractAllFields(text);
    CUR_FILE = {name:file.name, at:new Date().toISOString()};
    showUpdateParsePreview(fillUpdateForm(id, r), 'मॅन्युअली फील्ड्स भरा किंवा पेस्ट-बॉक्स पद्धत वापरा.');
  }catch(err){
    prev.innerHTML = `<div class="parsed-preview" style="background:var(--danger-bg);border-color:var(--danger);">⚠ PDF वाचता आलं नाही. पेस्ट-बॉक्स पद्धत वापरा.</div>`;
  }
  input.value = '';
}

function buildWaReportMessage(cl){
  const currentStage = cl.timeline[cl.timeline.length-1]?.stage || 'Intimation';
  let lines = [];
  lines.push(`नमस्कार, आपल्या क्लेमचा रिपोर्ट:`);
  lines.push(``);
  lines.push(`Patient: ${cl.patientName || cl.policyHolderName || '—'}`);
  if(cl.insurer) lines.push(`Insurer: ${cl.insurer}`);
  if(cl.policyNo) lines.push(`Policy No: ${cl.policyNo}`);
  if(cl.claimNo) lines.push(`Claim No: ${cl.claimNo}`);
  lines.push(``);
  lines.push(`टाइमलाइन:`);
  cl.timeline.forEach((t, i) => {
    let entry = `${i+1}) ${formatDate(t.date)} — ${t.stage}`;
    if(t.hospital) entry += ` (${t.hospital})`;
    if(t.amount) entry += ` — ₹${t.amount}`;
    lines.push(entry);
    if(t.note) lines.push(`   ${t.note}`);
    if(t.nextAction) lines.push(`   ➡ पुढील कृती: ${t.nextAction}`);
  });
  lines.push(``);
  lines.push(`सध्याचा स्टेटस: ${currentStage}`);
  lines.push(``);
  lines.push(`- ClaimTak`);
  return lines.join('\n');
}

/* ===================== REPORT (printable) ===================== */
function openReport(id){
  const cl = CLAIMS.find(x=>x.id===id);
  if(!cl) return;
  const currentStage = cl.timeline[cl.timeline.length-1]?.stage || 'Intimation';
  const rows = cl.timeline.map(t => `
    <tr>
      <td>${formatDate(t.date)}</td>
      <td>${esc(t.stage)}</td>
      <td>${esc(t.hospital||'—')}</td>
      <td>${t.amount ? '₹'+esc(t.amount) : '—'}</td>
      <td>${esc(t.note||'—')}</td>
      <td>${esc(t.nextAction||'—')}${t.nextDate?'<br>'+formatDate(t.nextDate):''}</td>
      <td>${formatDateTime(t.loggedAt)}<br><span style="color:#777;">${esc(t.loggedBy||'')}</span></td>
    </tr>
  `).join('');
  const html = `
    <!DOCTYPE html><html><head><meta charset="UTF-8"><title>Claim Report — ${esc(cl.patientName||cl.policyHolderName)}</title>
    <style>
      body{font-family:Arial,sans-serif;padding:24px;color:#1a2530;}
      h1{font-size:18px;color:#123152;margin-bottom:2px;}
      .meta{font-size:13px;color:#444;margin-bottom:14px;line-height:1.6;}
      table{width:100%;border-collapse:collapse;font-size:12px;margin-top:10px;}
      th,td{border:1px solid #ccc;padding:6px 8px;text-align:left;vertical-align:top;}
      th{background:#eef2f6;}
      .stamp{margin-top:20px;font-size:11px;color:#888;}
      @media print{ .no-print{display:none;} }
    </style>
    </head><body>
      <h1>ClaimTak — Claim Report</h1>
      <div class="meta">
        <b>Patient:</b> ${esc(cl.patientName||'—')} &nbsp; | &nbsp; <b>Policy Holder:</b> ${esc(cl.policyHolderName||'—')} &nbsp; | &nbsp; <b>Mobile:</b> ${esc(cl.mobile||'—')}<br>
        <b>Insurer:</b> ${esc(cl.insurer||'—')} &nbsp; | &nbsp; <b>Policy No:</b> ${esc(cl.policyNo||'—')} &nbsp; | &nbsp; <b>Sum Insured:</b> ${esc(cl.sumInsured||'—')}<br>
        <b>Policy Period:</b> ${formatDate(cl.policyFrom)} ते ${formatDate(cl.policyTo)} &nbsp; | &nbsp; <b>Claim No:</b> ${esc(cl.claimNo||'—')}<br>
        <b>क्लेम सुरू:</b> ${formatDate(cl.claimStart || cl.timeline[0]?.date)} &nbsp; | &nbsp; <b>सध्याचा टप्पा:</b> ${esc(currentStage)}
      </div>
      <table>
        <thead><tr><th>तारीख</th><th>टप्पा</th><th>हॉस्पिटल</th><th>रक्कम</th><th>नोट्स/कारण</th><th>पुढील कृती</th><th>नोंद (वेळ/कोणी)</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
      <h3 style="font-size:13px;margin:16px 0 4px;">क्लेम उघडल्याच्या नोंदी</h3><div style="font-size:12px;line-height:1.7;">${visitsHtml(cl,30)}</div>
      <div class="stamp">रिपोर्ट तयार केला: ${formatDateTime(new Date().toISOString())}</div>
      <div class="no-print" style="margin-top:16px;">
        <button onclick="window.print()" style="padding:8px 16px;">🖨 Print करा</button>
      </div>
    </body></html>
  `;
  const win = window.open('', '_blank');
  if(win){ win.document.write(html); win.document.close(); }
  else { showToast('Popup ब्लॉक झाला — popup परवानगी द्या'); }
}

/* ===================== RENDER: DASHBOARD (claims list) ===================== */
function listTabsHtml(){
  const n = k => CLAIMS.filter(c=>listOf(c)===k).length;
  const tab = (k,l) => `<button class="btn small ${VIEW_LIST===k?'':'secondary'}" onclick="setView('${k}')">${l} (${n(k)})</button>`;
  return `<div class="card" style="padding:10px 12px;">
    <div style="display:flex;gap:6px;flex-wrap:wrap;">${tab('live','🟢 Live')}${tab('approved','✅ Approved')}${tab('rejected','🔴 Rejected')}</div>
    <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;">
      <button class="btn small secondary" onclick="toggleSelectMode()">${SELECT_MODE?'✖ निवड रद्द':'☑ निवडा'}</button>
      ${SELECT_MODE ? `<button class="btn small" onclick="moveSelected('approved')">✅ Approved करा</button><button class="btn small" style="background:var(--danger);" onclick="moveSelected('rejected')">🔴 Rejected करा</button><button class="btn small" onclick="moveSelected('live')">🟢 Live मध्ये आणा</button>` : ''}
      <button class="btn small secondary" onclick="exportListsPdf()">📕 Export PDF</button>
    </div></div>`;
}
function setView(k){ VIEW_LIST = k; SELECTED = new Set(); render(); }
function toggleSelectMode(){ SELECT_MODE = !SELECT_MODE; SELECTED = new Set(); render(); }
function toggleSel(id){ SELECTED.has(id) ? SELECTED.delete(id) : SELECTED.add(id); render(); }
function moveSelected(st){
  if(!SELECTED.size){ showToast('आधी क्लेम निवडा'); return; }
  CLAIMS.forEach(c => { if(SELECTED.has(c.id)) c.status = st; });
  saveClaimsLocal(); const n = SELECTED.size; SELECTED = new Set(); SELECT_MODE = false; render(); showToast(n+' क्लेम हलवले');
}
function exportListsPdf(){
  const names = {live:'Live', approved:'Approved', rejected:'Rejected'};
  const sec = k => { const cs = CLAIMS.filter(c=>listOf(c)===k); return `<h2>${names[k]} (${cs.length})</h2>` + (cs.map(c => `
    <div class="c"><b>${esc(c.patientName||c.policyHolderName||'—')}</b> · Patient ID: ${ni(c.patientId)}<br>
    ${ni(c.productName)} · UIN: ${ni(c.uin)} · Policy No: ${ni(c.policyNo)} · ${c.policyFrom?formatDate(c.policyFrom):'—'} ते ${c.policyTo?formatDate(c.policyTo):'—'} · Inception: ${c.firstInception?formatDate(c.firstInception):'no information'}<br>
    Claim No: ${ni(c.claimNo)} · हॉस्पिटल: ${ni(c.hospital)} · Admission: ${c.admission?formatDate(c.admission):'no information'} · कारण: ${ni(c.diagnosis)}
    ${(c.timeline||[]).map(t=>`<div class="t"><i>${t.loggedAt?formatDateTime(t.loggedAt):''}</i> — <b>${esc(t.stage||'')}</b>${t.eventAt?' · पत्र: '+formatDateTime(t.eventAt):''}${t.status?'<br><span style="white-space:pre-wrap">'+esc(t.status)+'</span>':''}${t.note?'<br>'+esc(t.note):''}</div>`).join('')}</div>`).join('') || '<p>क्लेम नाही</p>'); };
  const w = window.open('', '_blank');
  if(!w){ showToast('पॉप-अप ब्लॉक झाला — परवानगी द्या'); return; }
  w.document.write(`<html><head><meta charset="utf-8"><title>ClaimTak</title><style>body{font-family:sans-serif;font-size:12px;padding:14px}.c{border:1px solid #999;padding:8px;margin:8px 0;page-break-inside:avoid}.t{margin:4px 0 0 10px;padding-left:6px;border-left:2px solid #bbb}</style></head><body><h1>ClaimTak — क्लेम यादी</h1>${sec('live')}${sec('approved')}${sec('rejected')}</body></html>`);
  w.document.close(); setTimeout(()=>w.print(), 500);
}
function renderDashboard(){
  return `
    <div class="row-between" style="margin-bottom:10px;">
      <div class="section-title" style="margin:0;">क्लेम्स</div>
      <button class="btn" onclick="openClaimModal()">+ नवीन क्लेम</button>
    </div>
    <div class="field" style="margin-bottom:10px;">
      <input id="claimSearchInput" type="text" placeholder="🔍 नावाने शोधा (Patient / Policy Holder)..." value="${esc(SEARCH_QUERY)}" oninput="handleSearchInput(this.value)">
    </div>
    <div class="card" style="padding:14px;border:2px dashed var(--accent);background:#f7fbff;">
      <div class="item-title" style="margin-bottom:6px;">📎 PDF / स्क्रीनशॉट अपलोड करा</div>
      <div class="item-sub" style="margin-bottom:8px;">पॉलिसी, क्लेम लेटर, Approval/Rejection/Query — काहीही टाका. नंबर, नावे, तारीख आपोआप भरली जातील. जुना क्लेम असेल तर तिथेच नवीन अपडेट जोडला जाईल.</div>
      <input type="file" accept="application/pdf,image/*" multiple onchange="handleQuickUpload(this)">
    </div>
    <div class="card" style="padding:12px 14px;">
      <div class="row-between">
        <div style="font-size:12.5px;color:var(--text-muted);">डेटा सध्या याच डिव्हाइसवर सेव्ह आहे. दुसऱ्या डिव्हाइसवर वापरण्यासाठी बॅकअप डाऊनलोड करून Google Drive मध्ये ठेवा, आणि तिथून अपलोड करून अपडेट करा.</div>
      </div>
      <div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;">
        <button class="btn small secondary" onclick="shareBackup()">☁ बॅकअप Google Drive मध्ये पाठवा</button>
        <button class="btn small secondary" onclick="exportAllCsv()">📊 सर्व क्लेम्स रिपोर्ट (Excel)</button>
        <button class="btn small secondary" onclick="exportBackup()">💾 बॅकअप डाऊनलोड करा</button>
        <button class="btn small secondary" onclick="triggerImport()">📤 बॅकअप अपलोड करा (अपडेट)</button>
        <input type="file" id="importFileInput" accept="application/json" style="display:none;" onchange="handleImportFile(this)">
      </div>
    </div>
    ${listTabsHtml()}
    ${dueBanner()}
    ${CLAIMS.length === 0 ? `<div class="card empty-state"><div class="icon">🏥</div>अजून कोणताही क्लेम नोंदवलेला नाही.</div>` :
    (() => {
      const q = SEARCH_QUERY.trim().toLowerCase();
      const base = CLAIMS.filter(c => listOf(c)===VIEW_LIST);
      const filtered = !q ? base : base.filter(c =>
        (c.patientName||'').toLowerCase().includes(q) ||
        (c.policyHolderName||'').toLowerCase().includes(q) ||
        (c.policyNo||'').toLowerCase().includes(q) || (c.oldPolicyNo||'').toLowerCase().includes(q) ||
        (c.claimNo||'').toLowerCase().includes(q)
      );
      if(filtered.length === 0){
        return `<div class="card empty-state"><div class="icon">🔍</div>${q ? '"'+esc(SEARCH_QUERY)+'" शी जुळणारा क्लेम सापडला नाही.' : 'या यादीत क्लेम नाही.'}</div>`;
      }
      const withIdx = filtered.map(c=>({c, i: CLAIMS.indexOf(c)}));
      const live = withIdx.filter(x => !x.c.status || x.c.status==='live').sort((a,b)=>b.i-a.i);
      const rest = withIdx.filter(x => x.c.status && x.c.status!=='live').sort((a,b)=>b.i-a.i);
      const ordered = [...live, ...rest].map(x=>x.c);
      return ordered.map(cl => {
        const stage = cl.timeline[cl.timeline.length-1]?.stage || 'Intimation';
        const sm = statusMeta(cl.status);
        return `
        <div class="list-item" style="cursor:pointer;" onclick="${SELECT_MODE ? `toggleSel('${cl.id}')` : `openClaimFromList('${cl.id}')`}">
          <div class="row-between">
            <div>
              <div class="item-title">${SELECT_MODE ? (SELECTED.has(cl.id) ? '☑ ' : '☐ ') : ''}${esc(cl.patientName || cl.policyHolderName || 'नाव नाही')}</div>
              <div class="item-sub">${esc(cl.insurer||'—')} · Policy No: ${esc(cl.policyNo||'—')}${cl.claimNo?' · Claim: '+esc(cl.claimNo):''}</div>
              ${dueHtml(cl)}
              ${(cl.visits&&cl.visits.length)?`<div class="item-sub" style="font-size:11px;">शेवटचे उघडले: ${formatDateTime(cl.visits[cl.visits.length-1])}</div>`:''}
            </div>
            <div style="display:flex;flex-direction:column;gap:4px;align-items:flex-end;">
              <span class="badge ${sm.cls}">${sm.label}</span>
              <span class="badge neutral" style="font-size:10.5px;">${esc(stage)}</span>
            </div>
          </div>
        </div>`;
      }).join('');
    })()}
  `;
}

/* ===================== MAIN RENDER ===================== */
function render(){
  const app = document.getElementById('app');
  app.innerHTML = `
    <header class="topbar">
      <div class="brand"><div class="brand-mark">CT</div><div class="brand-text"><h1>ClaimTak</h1><span>Claim Tracker</span></div></div>

    ${modalHtml ? `<div class="modal-overlay" onclick="if(event.target===this)closeModal()">${modalHtml}</div>` : ''}
  `;
}
