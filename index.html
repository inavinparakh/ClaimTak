<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ClaimTak — Claim Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --primary:#1e4d7b; --primary-dark:#123152; --primary-light:#2e6f9e; --accent:#3f8fc4;
    --bg:#f4f7fa; --surface:#ffffff; --border:#dbe4ec; --text:#1a2530; --text-muted:#5c6b7a;
    --success:#256c4b; --success-bg:#e5f3ec; --warning:#a06a1f; --warning-bg:#fbf0dc;
    --danger:#a4392f; --danger-bg:#fbe9e7; --radius:12px; --radius-sm:8px;
    --shadow:0 1px 3px rgba(20,40,60,0.08), 0 1px 2px rgba(20,40,60,0.06);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{font-family:'Inter','Noto Sans Devanagari',system-ui,sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;min-height:100vh;}
  #app{min-height:100vh;display:flex;flex-direction:column;}
  header.topbar{background:linear-gradient(135deg,var(--primary-dark),var(--primary));color:#fff;padding:14px 18px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 2px 8px rgba(10,30,50,0.18);position:sticky;top:0;z-index:50;}
  .brand{display:flex;align-items:center;gap:10px;}
  .brand-mark{width:36px;height:36px;border-radius:9px;background:rgba(255,255,255,0.14);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;border:1px solid rgba(255,255,255,0.25);}
  .brand-text h1{font-size:16px;margin:0;font-weight:700;}
  .brand-text span{font-size:11px;opacity:0.75;display:block;margin-top:1px;}
  .header-right{display:flex;align-items:center;gap:10px;}
  .user-chip{font-size:13px;background:rgba(255,255,255,0.12);padding:6px 12px;border-radius:20px;display:flex;align-items:center;gap:6px;}
  .logout-btn{background:transparent;border:1px solid rgba(255,255,255,0.35);color:#fff;padding:6px 12px;border-radius:20px;font-size:12px;cursor:pointer;font-family:inherit;}
  .logout-btn:hover{background:rgba(255,255,255,0.12);}
  main{flex:1;padding:16px;max-width:920px;width:100%;margin:0 auto;}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:12px;box-shadow:var(--shadow);}
  .section-title{font-size:15px;font-weight:700;margin:4px 0 12px;color:var(--primary-dark);}
  .row-between{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;}
  .btn{background:var(--primary);color:#fff;border:none;padding:10px 16px;border-radius:var(--radius-sm);font-size:13.5px;font-weight:600;cursor:pointer;font-family:inherit;transition:background .15s;}
  .btn:hover{background:var(--primary-dark);}
  .btn.secondary{background:var(--surface);color:var(--primary);border:1px solid var(--border);}
  .btn.secondary:hover{background:var(--bg);}
  .btn.success{background:#2f8f63;} .btn.success:hover{background:var(--success);}
  .btn.danger{background:var(--danger);}
  .btn.small{padding:6px 11px;font-size:12px;}
  .btn:disabled{opacity:0.5;cursor:not-allowed;}
  .field{margin-bottom:12px;}
  .field label{display:block;font-size:12.5px;font-weight:600;color:var(--text-muted);margin-bottom:5px;}
  .field input, .field select, .field textarea{width:100%;padding:9px 11px;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:13.5px;font-family:inherit;background:#fff;color:var(--text);}
  .field input:focus, .field select:focus, .field textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(63,143,196,0.15);}
  .field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  @media (max-width:520px){.field-row{grid-template-columns:1fr;}}
  .badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11.5px;font-weight:700;}
  .badge.success{background:var(--success-bg);color:var(--success);}
  .badge.warning{background:var(--warning-bg);color:var(--warning);}
  .badge.danger{background:var(--danger-bg);color:var(--danger);}
  .badge.neutral{background:#eef2f6;color:var(--text-muted);}
  .empty-state{text-align:center;padding:40px 20px;color:var(--text-muted);}
  .empty-state .icon{font-size:34px;margin-bottom:8px;}
  .list-item{border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px 14px;margin-bottom:8px;background:#fff;}
  .list-item:hover{border-color:var(--accent);}
  .item-title{font-weight:700;font-size:14px;}
  .item-sub{font-size:12.5px;color:var(--text-muted);margin-top:2px;}
  .modal-overlay{position:fixed;inset:0;background:rgba(15,30,45,0.45);display:flex;align-items:flex-start;justify-content:center;padding:24px 12px;z-index:100;overflow-y:auto;}
  .modal{background:#fff;border-radius:var(--radius);max-width:560px;width:100%;padding:20px;box-shadow:0 12px 40px rgba(0,0,0,0.25);margin-top:12px;}
  .modal h3{margin:0 0 14px;font-size:16px;color:var(--primary-dark);}
  .modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;flex-wrap:wrap;}
  .login-wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:20px;}
  .login-box{background:#fff;border-radius:var(--radius);box-shadow:0 10px 40px rgba(20,40,60,0.12);padding:32px 28px;max-width:380px;width:100%;border:1px solid var(--border);}
  .login-logo{text-align:center;margin-bottom:18px;}
  .login-logo .brand-mark{margin:0 auto 10px;background:var(--primary);color:#fff;width:52px;height:52px;font-size:18px;}
  .login-logo h1{font-size:19px;margin:0;color:var(--primary-dark);}
  .login-logo p{font-size:12.5px;color:var(--text-muted);margin:4px 0 0;}
  .link-btn{background:none;border:none;color:var(--primary);font-size:13px;cursor:pointer;font-family:inherit;font-weight:600;padding:0;}
  .error-text{color:var(--danger);font-size:12.5px;margin:-4px 0 10px;}
  .hint-text{color:var(--text-muted);font-size:11.5px;margin-top:6px;}
  .timeline{border-left:2px solid var(--border);padding-left:14px;margin:10px 0 10px 6px;}
  .timeline-entry{margin-bottom:14px;position:relative;}
  .timeline-entry::before{content:'';position:absolute;left:-19px;top:4px;width:9px;height:9px;border-radius:50%;background:var(--primary);}
  .timeline-entry .t-stage{font-weight:700;font-size:13px;}
  .timeline-entry .t-date{font-size:11.5px;color:var(--text-muted);}
  .timeline-entry .t-note{font-size:12.5px;color:var(--text);margin-top:2px;}
  .timeline-entry .t-log{font-size:10.5px;color:#8a97a5;margin-top:3px;font-style:italic;}
  .timeline-entry .t-meta{font-size:12px;color:var(--text-muted);margin-top:2px;}
  .doc-row{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--bg);}
  .doc-row:last-child{border-bottom:none;}
  .doc-row .doc-name{flex:1;font-size:13px;}
  .stage-select{font-size:12px;}
  .wa-btn{background:#25963f;color:#fff;border:none;padding:7px 12px;border-radius:20px;font-size:12px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:5px;text-decoration:none;}
  .wa-btn:hover{background:#1e7a33;}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--primary-dark);color:#fff;padding:10px 18px;border-radius:24px;font-size:13px;z-index:200;box-shadow:0 6px 20px rgba(0,0,0,0.25);}
  .footer-note{text-align:center;font-size:11px;color:var(--text-muted);padding:14px;}
  .paste-box{width:100%;min-height:110px;border:2px dashed var(--accent);border-radius:var(--radius-sm);padding:10px;font-family:monospace;font-size:12px;background:#f7fbff;}
  .parsed-preview{background:var(--success-bg);border:1px solid var(--success);border-radius:var(--radius-sm);padding:10px;margin-top:8px;font-size:12.5px;}
  .parsed-preview b{color:var(--success);}
  .report-table{width:100%;border-collapse:collapse;font-size:12.5px;}
  .report-table th, .report-table td{border:1px solid var(--border);padding:6px 8px;text-align:left;vertical-align:top;}
  .report-table th{background:var(--bg);}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* ===================== CONSTANTS ===================== */
const CLAIM_STAGES = ['Intimation','Preauth Sent','Preauth Query','Preauth Approved','Preauth Rejected',
  'Discharge','Form B Sent','Reimbursement Filed','Query Raised','Reply Sent','Settled','Rejected',
  'Reconsideration','Grievance','Bima Bharosa Cell','Ombudsman Online','Ombudsman Physical','Hearing','Final Result'];
const CLAIM_TYPES = ['Cashless','Reimbursement'];
const POLICY_KEYS = ['TYPE','INSURER','POLICY NO','POLICY HOLDER NAME','PATIENT NAME','SUM INSURED','POLICY FROM','POLICY TO'];
const UPDATE_KEYS = ['TYPE','STAGE','CLAIM NO','HOSPITAL','DATE','AMOUNT','NEXT ACTION','REASON'];
const ALL_KEYS = Array.from(new Set([...POLICY_KEYS, ...UPDATE_KEYS]));

/* ===================== STATE ===================== */
let CLAIMS = [];
let modalHtml = null;

/* ===================== STORAGE (localStorage + manual backup) ===================== */
function loadClaimsLocal(){
  try{ const raw = localStorage.getItem('ct_claims_local'); return raw ? JSON.parse(raw) : []; }
  catch(e){ return []; }
}
function saveClaimsLocal(){
  try{ localStorage.setItem('ct_claims_local', JSON.stringify(CLAIMS)); }
  catch(e){ showToast('या डिव्हाइसवर सेव्ह करताना त्रुटी आली'); }
}
function loadAll(){
  CLAIMS = loadClaimsLocal();
  render();
}
function getLastName(){
  try{ return localStorage.getItem('ct_last_name') || ''; } catch(e){ return ''; }
}
function setLastName(name){
  try{ localStorage.setItem('ct_last_name', name); } catch(e){}
}

/* ===================== BACKUP: EXPORT / IMPORT ===================== */
function exportBackup(){
  const blob = new Blob([JSON.stringify(CLAIMS, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const stamp = new Date().toISOString().slice(0,10);
  a.href = url; a.download = `claimtak-backup-${stamp}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
  showToast('बॅकअप डाऊनलोड झाला — आता Google Drive मध्ये सेव्ह करा');
}
function triggerImport(){
  document.getElementById('importFileInput').click();
}
function handleImportFile(input){
  const file = input.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    try{
      const incoming = JSON.parse(e.target.result);
      if(!Array.isArray(incoming)) throw new Error('invalid');
      const map = {};
      CLAIMS.forEach(c => map[c.id] = c);
      incoming.forEach(c => map[c.id] = c);
      CLAIMS = Object.values(map);
      saveClaimsLocal();
      render();
      showToast(`✓ ${incoming.length} क्लेम्स अपडेट/जोडले गेले`);
    }catch(err){
      showToast('⚠ फाईल वाचता आली नाही — योग्य .json बॅकअप फाईल निवडा');
    }
  };
  reader.readAsText(file);
  input.value = '';
}

/* ===================== UTIL ===================== */
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function esc(s){ return (s===undefined||s===null) ? '' : String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function todayISO(){ return new Date().toISOString().slice(0,10); }
function formatDate(iso){
  if(!iso) return '—';
  const d = new Date(iso);
  if(isNaN(d)) return iso;
  return d.toLocaleDateString('en-IN',{weekday:'short', day:'2-digit',month:'short',year:'numeric'});
}
function formatDateTime(iso){
  if(!iso) return '—';
  const d = new Date(iso);
  if(isNaN(d)) return iso;
  return d.toLocaleDateString('en-IN',{weekday:'short', day:'2-digit',month:'short',year:'numeric'}) + ', ' +
         d.toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'});
}
function parseFlexibleDate(str){
  if(!str) return '';
  str = str.trim();
  const d = new Date(str);
  if(!isNaN(d)) return d.toISOString().slice(0,10);
  return '';
}
function waLink(mobile, message){
  let digits = (mobile||'').replace(/\D/g,'');
  if(digits.length === 10) digits = '91' + digits;
  return `https://wa.me/${digits}?text=${encodeURIComponent(message)}`;
}
function showToast(msg){
  const t = document.createElement('div');
  t.className = 'toast'; t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(), 2400);
}
function stageBadgeClass(stage){
  if(['Settled','Preauth Approved','Final Result'].includes(stage)) return 'success';
  if(['Rejected','Preauth Rejected'].includes(stage)) return 'danger';
  return 'warning';
}

/* ===================== PASTE PARSER ===================== */
function parsePastedText(text){
  const lines = (text||'').split(/\r?\n/);
  const result = {};
  let currentKey = null;
  for(let raw of lines){
    const line = raw.trim();
    if(!line) continue;
    const idx = line.indexOf(':');
    let matched = null;
    if(idx > -1){
      const label = line.slice(0, idx).trim().toUpperCase();
      matched = ALL_KEYS.find(k => k === label);
    }
    if(matched){
      currentKey = matched;
      result[currentKey] = line.slice(idx+1).trim();
    } else if(currentKey){
      result[currentKey] = (result[currentKey] ? result[currentKey] + ' ' : '') + line;
    }
  }
  return result;
}

/* ===================== MODAL ===================== */
function openModal(html){ modalHtml = html; render(); }
function closeModal(){ modalHtml = null; render(); }

/* ===================== CLAIM: CREATE / EDIT BASE INFO ===================== */
function openClaimModal(id){
  const cl = id ? CLAIMS.find(x=>x.id===id) : null;
  openModal(`
    <div class="modal">
      <h3>${cl ? 'पॉलिसी माहिती एडिट करा' : 'नवीन क्लेम — पॉलिसी माहिती'}</h3>
      <div class="field">
        <label>📋 PDF मधून तयार केलेला "TYPE: POLICY" मजकूर इथे पेस्ट करा (ऐच्छिक)</label>
        <textarea id="policyPasteBox" class="paste-box" placeholder="TYPE: POLICY
INSURER: ...
POLICY NO: ...
POLICY HOLDER NAME: ...
PATIENT NAME: ...
MOBILE: ...
SUM INSURED: ...
POLICY FROM: ...
POLICY TO: ..."></textarea>
        <button type="button" class="btn small secondary" style="margin-top:6px;" onclick="parsePolicyPaste()">⚡ पार्स करून फील्ड्स भरा</button>
        <div id="policyParsePreview"></div>
      </div>
      <form id="claimForm">
        ${cl ? '' : `<div class="field"><label>तुमचे नाव (कोणी क्लेम सुरू केला) *</label><input name="enteredBy" required value="${esc(getLastName())}"></div>`}
        <div class="field"><label>Policy Holder Name *</label><input name="policyHolderName" required value="${esc(cl?.policyHolderName)}"></div>
        <div class="field"><label>Patient Name (क्लेमसाठीची व्यक्ती) *</label><input name="patientName" required value="${esc(cl?.patientName)}"></div>
        <div class="field"><label>मोबाईल नंबर (WhatsApp साठी — मॅन्युअली टाका)</label><input name="mobile" value="${esc(cl?.mobile)}" placeholder="9876543210"></div>
        <div class="field-row">
          <div class="field"><label>Insurer (कंपनी)</label><input name="insurer" value="${esc(cl?.insurer)}"></div>
          <div class="field"><label>Policy Number</label><input name="policyNo" value="${esc(cl?.policyNo)}"></div>
        </div>
        <div class="field-row">
          <div class="field"><label>Sum Insured</label><input name="sumInsured" value="${esc(cl?.sumInsured)}"></div>
          <div class="field"><label>Claim No. (Intimation No.)</label><input name="claimNo" value="${esc(cl?.claimNo)}"></div>
        </div>
        <div class="field-row">
          <div class="field"><label>Policy Period From</label><input type="date" name="policyFrom" value="${esc(cl?.policyFrom)}"></div>
          <div class="field"><label>Policy Period To</label><input type="date" name="policyTo" value="${esc(cl?.policyTo)}"></div>
        </div>
        <div class="modal-actions">
          ${cl ? `<button type="button" class="btn danger" onclick="deleteClaim('${id}')">डिलीट</button>` : ''}
          <button type="button" class="btn secondary" onclick="${cl ? `openClaimDetail('${id}')` : 'closeModal()'}">रद्द करा</button>
          <button type="submit" class="btn">${cl ? 'अपडेट करा' : 'क्लेम तयार करा'}</button>
        </div>
      </form>
    </div>
  `);
  document.getElementById('claimForm').onsubmit = async (e) => {
    e.preventDefault();
    const f = e.target;
    const enteredBy = cl ? cl.createdBy : f.enteredBy.value.trim();
    if(!cl) setLastName(enteredBy);
    const data = cl ? {...cl} : {
      id: uid(),
      timeline: [{stage:'Intimation', date: todayISO(), amount:'', nextAction:'', note:'', hospital:'',
                  loggedAt: new Date().toISOString(), loggedBy: enteredBy}],
      createdBy: enteredBy
    };
    data.policyHolderName = f.policyHolderName.value.trim();
    data.patientName = f.patientName.value.trim();
    data.mobile = f.mobile.value.trim();
    data.insurer = f.insurer.value.trim();
    data.policyNo = f.policyNo.value.trim();
    data.sumInsured = f.sumInsured.value.trim();
    data.claimNo = f.claimNo.value.trim();
    data.policyFrom = f.policyFrom.value;
    data.policyTo = f.policyTo.value;
    if(cl){ CLAIMS = CLAIMS.map(x=>x.id===id?data:x); } else { CLAIMS.push(data); }
    saveClaimsLocal();
    closeModal(); showToast('जतन झाले');
    openClaimDetail(data.id);
  };
}
function parsePolicyPaste(){
  const text = document.getElementById('policyPasteBox').value;
  const r = parsePastedText(text);
  const f = document.getElementById('claimForm');
  const map = {
    'POLICY HOLDER NAME':'policyHolderName', 'PATIENT NAME':'patientName',
    'INSURER':'insurer', 'POLICY NO':'policyNo', 'SUM INSURED':'sumInsured'
  };
  let filled = [];
  for(const k in map){ if(r[k]){ f[map[k]].value = r[k]; filled.push(k); } }
  if(r['POLICY FROM']){ f.policyFrom.value = parseFlexibleDate(r['POLICY FROM']); filled.push('POLICY FROM'); }
  if(r['POLICY TO']){ f.policyTo.value = parseFlexibleDate(r['POLICY TO']); filled.push('POLICY TO'); }
  const prev = document.getElementById('policyParsePreview');
  if(filled.length){
    prev.innerHTML = `<div class="parsed-preview"><b>✓ भरले गेले:</b> ${filled.join(', ')}. खाली तपासून Save करा.</div>`;
  } else {
    prev.innerHTML = `<div class="parsed-preview" style="background:var(--danger-bg);border-color:var(--danger);"><b>⚠ काहीच ओळखलं नाही.</b> फॉरमॅट तपासा (उदा. "POLICY NO: ...").</div>`;
  }
}
async function deleteClaim(id){
  if(!confirm('हा क्लेम कायमचा डिलीट करायचा आहे का?')) return;
  CLAIMS = CLAIMS.filter(x=>x.id!==id);
  saveClaimsLocal();
  closeModal(); showToast('क्लेम डिलीट झाला');
}

/* ===================== CLAIM: DETAIL VIEW ===================== */
function openClaimDetail(id){
  const cl = CLAIMS.find(x=>x.id===id);
  if(!cl) return;
  const currentStage = cl.timeline[cl.timeline.length-1]?.stage || 'Intimation';
  openModal(`
    <div class="modal" style="max-width:600px;">
      <h3>${esc(cl.patientName || cl.policyHolderName)} — क्लेम तपशील</h3>
      <div class="item-sub" style="margin-bottom:4px;">Policy Holder: ${esc(cl.policyHolderName||'—')} · मोबाईल: ${esc(cl.mobile||'—')}</div>
      <div class="item-sub" style="margin-bottom:4px;">${esc(cl.insurer||'—')} · Policy No: ${esc(cl.policyNo||'—')} · Sum Insured: ${esc(cl.sumInsured||'—')}</div>
      <div class="item-sub" style="margin-bottom:10px;">Policy Period: ${formatDate(cl.policyFrom)} ते ${formatDate(cl.policyTo)} ${cl.claimNo ? `· Claim No: ${esc(cl.claimNo)}` : ''}</div>
      <div style="margin-bottom:10px;">सध्याचा टप्पा: <span class="badge ${stageBadgeClass(currentStage)}">${esc(currentStage)}</span></div>

      <div class="row-between" style="margin-bottom:6px;">
        <strong style="font-size:13px;">टाइमलाइन (कामाचा तपशील)</strong>
        <button class="btn small secondary" onclick="openAddUpdateForm('${id}')">+ नवीन अपडेट</button>
      </div>
      <div class="timeline">
        ${cl.timeline.slice().reverse().map(t => `
          <div class="timeline-entry">
            <div class="t-stage">${esc(t.stage)}</div>
            <div class="t-date">काम झाल्याची तारीख: ${formatDate(t.date)}</div>
            ${t.hospital ? `<div class="t-meta">हॉस्पिटल: ${esc(t.hospital)}</div>` : ''}
            ${t.amount ? `<div class="t-meta">रक्कम: ₹${esc(t.amount)}</div>` : ''}
            ${t.note ? `<div class="t-note">${esc(t.note)}</div>` : ''}
            ${t.nextAction ? `<div class="t-meta">➡ पुढील कृती: ${esc(t.nextAction)}</div>` : ''}
            <div class="t-log">नोंद: ${formatDateTime(t.loggedAt)} · ${esc(t.loggedBy||'—')}</div>
          </div>
        `).join('')}
      </div>

      <div class="modal-actions">
        ${cl.mobile ? `<a class="wa-btn" target="_blank" href="${waLink(cl.mobile, buildWaReportMessage(cl))}">WhatsApp अपडेट (पूर्ण रिपोर्ट)</a>` : ''}
        <button type="button" class="btn secondary" onclick="openReport('${id}')">📄 रिपोर्ट पहा/प्रिंट</button>
        <button type="button" class="btn secondary" onclick="openClaimModal('${id}')">पॉलिसी माहिती एडिट</button>
        <button type="button" class="btn secondary" onclick="closeModal()">बंद करा</button>
      </div>
    </div>
  `);
}

/* ===================== CLAIM: ADD UPDATE (with paste parser) ===================== */
function openAddUpdateForm(id){
  openModal(`
    <div class="modal">
      <h3>नवीन क्लेम अपडेट जोडा</h3>
      <div class="field">
        <label>📋 PDF मधून तयार केलेला "TYPE: CLAIM UPDATE" मजकूर इथे पेस्ट करा (ऐच्छिक)</label>
        <textarea id="updatePasteBox" class="paste-box" placeholder="TYPE: CLAIM UPDATE
STAGE: ...
CLAIM NO: ...
HOSPITAL: ...
DATE: ...
AMOUNT: ...
NEXT ACTION: ...
REASON: ..."></textarea>
        <button type="button" class="btn small secondary" style="margin-top:6px;" onclick="parseUpdatePaste('${id}')">⚡ पार्स करून फील्ड्स भरा</button>
        <div id="updateParsePreview"></div>
      </div>
      <form id="updateForm">
        <div class="field"><label>तुमचे नाव (कोणी अपडेट केला) *</label><input name="enteredBy" required value="${esc(getLastName())}"></div>
        <div class="field"><label>टप्पा (Stage) *</label>
          <select name="stage" required>${CLAIM_STAGES.map(s=>`<option>${s}</option>`).join('')}</select>
        </div>
        <div class="field-row">
          <div class="field"><label>काम झाल्याची तारीख *</label><input type="date" name="date" required value="${todayISO()}"></div>
          <div class="field"><label>रक्कम (₹)</label><input name="amount" placeholder="उदा. 22373"></div>
        </div>
        <div class="field"><label>हॉस्पिटल</label><input name="hospital"></div>
        <div class="field"><label>पुढील कृती / Next Action</label><input name="nextAction" placeholder="उदा. रीसबमिशनसाठी अर्ज करा"></div>
        <div class="field"><label>नोट्स / कारण (Reason)</label><textarea name="note" rows="3" placeholder="PDF मधली इतर माहिती इथे पेस्ट/टाईप करा"></textarea></div>
        <div class="hint-text">तारीख तुम्ही निवडता (मागील तारीखही चालेल); नोंदीची वेळ आपोआप सेव्ह होते.</div>
        <div class="modal-actions">
          <button type="button" class="btn secondary" onclick="openClaimDetail('${id}')">मागे</button>
          <button type="submit" class="btn">जोडा</button>
        </div>
      </form>
    </div>
  `);
  document.getElementById('updateForm').onsubmit = async (e) => {
    e.preventDefault();
    const f = e.target;
    const enteredBy = f.enteredBy.value.trim();
    setLastName(enteredBy);
    const cl = CLAIMS.find(x=>x.id===id);
    cl.timeline.push({
      stage: f.stage.value, date: f.date.value, amount: f.amount.value.trim(),
      hospital: f.hospital.value.trim(), nextAction: f.nextAction.value.trim(), note: f.note.value.trim(),
      loggedAt: new Date().toISOString(), loggedBy: enteredBy
    });
    saveClaimsLocal();
    closeModal(); showToast('अपडेट जतन झाले');
    openClaimDetail(id);
  };
}
function parseUpdatePaste(id){
  const text = document.getElementById('updatePasteBox').value;
  const r = parsePastedText(text);
  const f = document.getElementById('updateForm');
  let filled = [];
  if(r['STAGE']){
    const match = CLAIM_STAGES.find(s => s.toLowerCase() === r['STAGE'].toLowerCase());
    f.stage.value = match || CLAIM_STAGES[0];
    filled.push('STAGE');
  }
  if(r['DATE']){ f.date.value = parseFlexibleDate(r['DATE']) || todayISO(); filled.push('DATE'); }
  if(r['AMOUNT']){ f.amount.value = r['AMOUNT']; filled.push('AMOUNT'); }
  if(r['HOSPITAL']){ f.hospital.value = r['HOSPITAL']; filled.push('HOSPITAL'); }
  if(r['NEXT ACTION']){ f.nextAction.value = r['NEXT ACTION']; filled.push('NEXT ACTION'); }
  if(r['REASON']){ f.note.value = r['REASON']; filled.push('REASON'); }
  if(r['CLAIM NO']){
    const cl = CLAIMS.find(x=>x.id===id);
    if(cl && !cl.claimNo){ cl.claimNo = r['CLAIM NO']; saveClaimsLocal(); }
    filled.push('CLAIM NO (क्लेमला जोडले)');
  }
  const prev = document.getElementById('updateParsePreview');
  if(filled.length){
    prev.innerHTML = `<div class="parsed-preview"><b>✓ भरले गेले:</b> ${filled.join(', ')}. खाली तपासून Save करा.</div>`;
  } else {
    prev.innerHTML = `<div class="parsed-preview" style="background:var(--danger-bg);border-color:var(--danger);"><b>⚠ काहीच ओळखलं नाही.</b> फॉरमॅट तपासा (उदा. "STAGE: ...").</div>`;
  }
}

function buildWaReportMessage(cl){
  const currentStage = cl.timeline[cl.timeline.length-1]?.stage || 'Intimation';
  let lines = [];
  lines.push(`नमस्कार, आपल्या क्लेमचा रिपोर्ट:`);
  lines.push(``);
  lines.push(`Patient: ${cl.patientName || cl.policyHolderName || '—'}`);
  if(cl.insurer) lines.push(`Insurer: ${cl.insurer}`);
  if(cl.policyNo) lines.push(`Policy No: ${cl.policyNo}`);
  if(cl.claimNo) lines.push(`Claim No: ${cl.claimNo}`);
  lines.push(``);
  lines.push(`टाइमलाइन:`);
  cl.timeline.forEach((t, i) => {
    let entry = `${i+1}) ${formatDate(t.date)} — ${t.stage}`;
    if(t.hospital) entry += ` (${t.hospital})`;
    if(t.amount) entry += ` — ₹${t.amount}`;
    lines.push(entry);
    if(t.note) lines.push(`   ${t.note}`);
    if(t.nextAction) lines.push(`   ➡ पुढील कृती: ${t.nextAction}`);
  });
  lines.push(``);
  lines.push(`सध्याचा स्टेटस: ${currentStage}`);
  lines.push(``);
  lines.push(`- ClaimTak`);
  return lines.join('\n');
}

/* ===================== REPORT (printable) ===================== */
function openReport(id){
  const cl = CLAIMS.find(x=>x.id===id);
  if(!cl) return;
  const currentStage = cl.timeline[cl.timeline.length-1]?.stage || 'Intimation';
  const rows = cl.timeline.map(t => `
    <tr>
      <td>${formatDate(t.date)}</td>
      <td>${esc(t.stage)}</td>
      <td>${esc(t.hospital||'—')}</td>
      <td>${t.amount ? '₹'+esc(t.amount) : '—'}</td>
      <td>${esc(t.note||'—')}</td>
      <td>${esc(t.nextAction||'—')}</td>
      <td>${formatDateTime(t.loggedAt)}<br><span style="color:#777;">${esc(t.loggedBy||'')}</span></td>
    </tr>
  `).join('');
  const html = `
    <!DOCTYPE html><html><head><meta charset="UTF-8"><title>Claim Report — ${esc(cl.patientName||cl.policyHolderName)}</title>
    <style>
      body{font-family:Arial,sans-serif;padding:24px;color:#1a2530;}
      h1{font-size:18px;color:#123152;margin-bottom:2px;}
      .meta{font-size:13px;color:#444;margin-bottom:14px;line-height:1.6;}
      table{width:100%;border-collapse:collapse;font-size:12px;margin-top:10px;}
      th,td{border:1px solid #ccc;padding:6px 8px;text-align:left;vertical-align:top;}
      th{background:#eef2f6;}
      .stamp{margin-top:20px;font-size:11px;color:#888;}
      @media print{ .no-print{display:none;} }
    </style>
    </head><body>
      <h1>ClaimTak — Claim Report</h1>
      <div class="meta">
        <b>Patient:</b> ${esc(cl.patientName||'—')} &nbsp; | &nbsp; <b>Policy Holder:</b> ${esc(cl.policyHolderName||'—')} &nbsp; | &nbsp; <b>Mobile:</b> ${esc(cl.mobile||'—')}<br>
        <b>Insurer:</b> ${esc(cl.insurer||'—')} &nbsp; | &nbsp; <b>Policy No:</b> ${esc(cl.policyNo||'—')} &nbsp; | &nbsp; <b>Sum Insured:</b> ${esc(cl.sumInsured||'—')}<br>
        <b>Policy Period:</b> ${formatDate(cl.policyFrom)} ते ${formatDate(cl.policyTo)} &nbsp; | &nbsp; <b>Claim No:</b> ${esc(cl.claimNo||'—')}<br>
        <b>सध्याचा टप्पा:</b> ${esc(currentStage)}
      </div>
      <table>
        <thead><tr><th>तारीख</th><th>टप्पा</th><th>हॉस्पिटल</th><th>रक्कम</th><th>नोट्स/कारण</th><th>पुढील कृती</th><th>नोंद (वेळ/कोणी)</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
      <div class="stamp">रिपोर्ट तयार केला: ${formatDateTime(new Date().toISOString())}</div>
      <div class="no-print" style="margin-top:16px;">
        <button onclick="window.print()" style="padding:8px 16px;">🖨 Print करा</button>
      </div>
    </body></html>
  `;
  const win = window.open('', '_blank');
  if(win){ win.document.write(html); win.document.close(); }
  else { showToast('Popup ब्लॉक झाला — popup परवानगी द्या'); }
}

/* ===================== RENDER: DASHBOARD (claims list) ===================== */
function renderDashboard(){
  return `
    <div class="row-between" style="margin-bottom:10px;">
      <div class="section-title" style="margin:0;">क्लेम्स</div>
      <button class="btn" onclick="openClaimModal()">+ नवीन क्लेम</button>
    </div>
    <div class="card" style="padding:12px 14px;">
      <div class="row-between">
        <div style="font-size:12.5px;color:var(--text-muted);">डेटा सध्या याच डिव्हाइसवर सेव्ह आहे. दुसऱ्या डिव्हाइसवर वापरण्यासाठी बॅकअप डाऊनलोड करून Google Drive मध्ये ठेवा, आणि तिथून अपलोड करून अपडेट करा.</div>
      </div>
      <div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;">
        <button class="btn small secondary" onclick="exportBackup()">💾 बॅकअप डाऊनलोड करा</button>
        <button class="btn small secondary" onclick="triggerImport()">📤 बॅकअप अपलोड करा (अपडेट)</button>
        <input type="file" id="importFileInput" accept="application/json" style="display:none;" onchange="handleImportFile(this)">
      </div>
    </div>
    ${CLAIMS.length === 0 ? `<div class="card empty-state"><div class="icon">🏥</div>अजून कोणताही क्लेम नोंदवलेला नाही.</div>` :
    CLAIMS.slice().reverse().map(cl => {
      const stage = cl.timeline[cl.timeline.length-1]?.stage || 'Intimation';
      return `
      <div class="list-item" style="cursor:pointer;" onclick="openClaimDetail('${cl.id}')">
        <div class="row-between">
          <div>
            <div class="item-title">${esc(cl.patientName || cl.policyHolderName || 'नाव नाही')}</div>
            <div class="item-sub">${esc(cl.insurer||'—')} · Policy No: ${esc(cl.policyNo||'—')}</div>
          </div>
          <span class="badge ${stageBadgeClass(stage)}">${esc(stage)}</span>
        </div>
      </div>`;
    }).join('')}
  `;
}

}
